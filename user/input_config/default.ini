#inFAMOUS Second Son - PC keyboard + mouse layout (2026-10-17; the release default).
#Goes in user/input_config/default.ini: shadPS4 reads default.ini while use_unified_input_config is on (its default).
#Needs SHADPS4_MOUSE_AIM=1 for the mouse camera. Hotkeys (Y / T / X) are in global.ini.

# Keyboard
axis_left_x_minus = q
axis_left_x_plus = d
axis_left_y_minus = z
axis_left_y_plus = s

cross = space
circle = lshift
square = c
triangle = f

l1 = a
r1 = e
l3 = u
r3 = o

touchpad_left = r
touchpad_right = g
options = enter

pad_up = up
pad_down = down
pad_left = left
pad_right = right

# Backup camera on IJKL (I / K also zoom the full map)
axis_right_x_minus = j
axis_right_x_plus = l
axis_right_y_minus = i
axis_right_y_plus = k

# Numpad face buttons (spare)
triangle = kp8
circle = kp6
cross = kp2
square = kp4

# Mouse: camera with mouse aim (Y toggles); left click = R2 (shoot), right click = L2 (aim) are
# added by the emulator while the mouse aims - do not bind leftbutton / rightbutton here.
# W (hold) = tilt the controller (AZERTY), X = rattle the can (both with the motion sensor mode).

# Controller
cross = cross
circle = circle
square = square
triangle = triangle

l1 = l1
r1 = r1
l2 = l2
r2 = r2
l3 = l3
r3 = r3

options = options

pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right

axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

# Range of deadzones: 1 (almost none) to 127 (max)
analog_deadzone = leftjoystick, 2, 127
analog_deadzone = rightjoystick, 2, 127

override_controller_color = false, 255, 0, 255
